<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>THE BLOW | Authorized Sign In</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#394820;color:#f7efdc;font-family:Arial,Helvetica,sans-serif;padding:20px}.login{width:min(100%,390px);padding:30px 25px;background:#10110d;border:1px solid #b78a48;border-radius:12px;box-shadow:0 18px 60px #0008;text-align:center}.crown{font-size:27px;color:#e7b95f}h1{font-family:Georgia,serif;font-weight:normal;letter-spacing:.16em;color:#e7b95f;margin:8px 0}.sub{font-size:12px;letter-spacing:.2em;color:#d7bd86;margin-bottom:25px}label{display:block;text-align:left;font-size:13px;margin:14px 0 7px;color:#e8d7b5}input{width:100%;padding:12px;border-radius:7px;border:1px solid #806638;background:#22251a;color:#fff;font-size:15px}button{width:100%;margin-top:20px;padding:12px;border:1px solid #fff0ae;border-radius:7px;background:linear-gradient(120deg,#dba83e,#ffe47a,#dba83e);color:#241a08;font-weight:bold;font-size:14px;cursor:pointer}.error{min-height:18px;color:#ff9d8e;font-size:13px;margin-top:13px}.back{display:inline-block;margin-top:18px;color:#c9b17e;font-size:12px;text-decoration:none}
</style>
</head>
<body>
<form class="login" id="loginForm">
<div class="crown">♛</div><h1>THE BLOW</h1><div class="sub">AUTHORIZED MENU EDITOR</div>
<label for="username">Username</label><input id="username" name="username" autocomplete="username" required>
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit">SIGN IN</button><div class="error" id="error" role="alert"></div>
<a class="back" href="index.html">← Back to menu</a>
</form>
<script>
const USERNAME = "blow";
// SHA-256 digest of the configured password; no plain-text password is stored in this file.
const PASSWORD_SHA256 = "5720376ab7ef17ca9638ea587ec23d42fcd24071cab3ebe399248916fe09bf70";
async function sha256(value){const bytes=new TextEncoder().encode(value);const digest=await crypto.subtle.digest("SHA-256",bytes);return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,"0")).join("");}
document.getElementById("loginForm").addEventListener("submit",async event=>{event.preventDefault();const username=document.getElementById("username").value.trim();const password=document.getElementById("password").value;const digest=await sha256(password);if(username===USERNAME&&digest===PASSWORD_SHA256){sessionStorage.setItem("theBlowEditorAuth","ok");location.href="preview.html";}else{document.getElementById("error").textContent="Incorrect username or password.";document.getElementById("password").value="";}});
</script>
</body>
</html>
